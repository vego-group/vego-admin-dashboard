# Checks every pull request: typecheck, lint, production build.
#
# There is deliberately no deploy job: Vercel's Git integration deploys this
# repo (previews for PRs, production on merge to main).
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # No env needed: every page is static and reads NEXT_PUBLIC_API_URL only
      # in the browser. The build would also lint, so that step is skipped here.
      - name: Build
        run: npx next build --no-lint
